services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: camposanto_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - camposanto_storage:/var/www/html/storage
      - camposanto_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - camposanto

  nginx:
    image: nginx:alpine
    container_name: camposanto_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - camposanto

  db:
    image: postgres:16-alpine
    container_name: camposanto_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-camposanto}
      POSTGRES_USER: ${DB_USERNAME:-camposanto}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - camposanto_db_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-camposanto} -d ${DB_DATABASE:-camposanto}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - camposanto

  node:
    image: node:20-alpine
    container_name: camposanto_node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: sh -c "npm install && npm run build"
    profiles:
      - assets
    networks:
      - camposanto

networks:
  camposanto:
    driver: bridge

volumes:
  camposanto_db_data:
  camposanto_storage:
  camposanto_bootstrap_cache:
